<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Niche Knowledge Check</title>
<style>
  :root{
    --bg:#f4f5f9; --card:#ffffff; --ink:#1b1d25; --muted:#61667a;
    --line:#e2e4ed; --line-strong:#cdd1e0;
    --accent:#5865f2; --accent-ink:#ffffff; --accent-soft:#eceefe;
    --bad:#c62f3d;
    --radius:14px; --shadow:0 1px 2px rgba(20,22,40,.06), 0 8px 24px rgba(20,22,40,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#11131a; --card:#191c25; --ink:#e9eaf0; --muted:#9aa0b5;
      --line:#272b37; --line-strong:#39405280;
      --accent:#7c86f7; --accent-ink:#0f1117; --accent-soft:#23283f;
      --bad:#ff7a86;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; justify-content:center;
    padding:24px 16px 64px;
  }
  .wrap{width:100%; max-width:640px}
  .card{
    background:var(--card); border:1px solid var(--line);
    border-radius:var(--radius); box-shadow:var(--shadow);
    padding:28px 24px;
  }
  h1{margin:0 0 8px; font-size:24px; letter-spacing:-.01em}
  h2{margin:0 0 6px; font-size:19px; letter-spacing:-.01em}
  p{margin:0 0 14px}
  .muted{color:var(--muted); font-size:14.5px}
  .hidden{display:none !important}

  /* ---------- intro ---------- */
  label{display:block; font-weight:600; font-size:14px; margin:18px 0 6px}
  input[type=text]{
    width:100%; padding:12px 14px; font-size:16px; color:var(--ink);
    background:var(--bg); border:1px solid var(--line-strong);
    border-radius:10px; outline:none;
  }
  input[type=text]:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:12px 20px; font:inherit; font-weight:600; cursor:pointer;
    background:var(--accent); color:var(--accent-ink);
    border:1px solid transparent; border-radius:10px;
  }
  .btn:hover{filter:brightness(1.06)}
  .btn:disabled{opacity:.5; cursor:not-allowed}
  .btn.ghost{background:transparent; color:var(--muted); border-color:var(--line-strong)}
  .btn.ghost:hover{color:var(--ink); border-color:var(--accent)}
  .row{display:flex; gap:10px; align-items:center; margin-top:22px; flex-wrap:wrap}
  .row .spacer{flex:1}

  /* ---------- progress ---------- */
  .meta{display:flex; justify-content:space-between; align-items:baseline; font-size:13.5px; color:var(--muted); margin-bottom:8px}
  .bar{height:6px; background:var(--line); border-radius:99px; overflow:hidden; margin-bottom:24px}
  .bar>i{display:block; height:100%; width:0; background:var(--accent); border-radius:99px; transition:width .25s ease}

  /* ---------- options ---------- */
  .qtext{font-size:19px; font-weight:600; line-height:1.4; margin:0 0 18px; letter-spacing:-.01em}
  .options{display:flex; flex-direction:column; gap:10px}
  .option{
    display:flex; align-items:flex-start; gap:12px; width:100%; text-align:left;
    padding:14px 16px; font:inherit; color:var(--ink); cursor:pointer;
    background:var(--bg); border:1px solid var(--line-strong); border-radius:12px;
  }
  .option:hover{border-color:var(--accent)}
  .option:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .option[aria-checked="true"]{border-color:var(--accent); background:var(--accent-soft)}
  .key{
    flex:none; width:24px; height:24px; border-radius:7px; font-size:13px; font-weight:700;
    display:grid; place-items:center; background:var(--card); border:1px solid var(--line-strong); color:var(--muted);
  }
  .option[aria-checked="true"] .key{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
  .err{color:var(--bad); font-size:14px; font-weight:500; margin-top:12px; min-height:0}

  /* ---------- results ---------- */
  .score{font-size:52px; font-weight:700; letter-spacing:-.03em; line-height:1.05; margin:4px 0 2px}
  .score small{font-size:22px; font-weight:600; color:var(--muted)}
  .band{font-size:17px; font-weight:600; margin:10px 0 4px}
  .pill{display:inline-block; padding:4px 10px; border-radius:99px; font-size:13px; font-weight:600; background:var(--accent-soft); color:var(--accent)}
  hr{border:0; border-top:1px solid var(--line); margin:24px 0}
  .hist{font-size:14px; color:var(--muted); margin:0; padding-left:18px}
  .hist li{margin:3px 0}
  .status{font-size:13px; color:var(--muted); margin-top:18px}
</style>
</head>
<body>
<div class="wrap">

<!-- ============================================================
     SCREEN 1: handle entry
     ============================================================ -->
<main class="card" id="screen-intro">
  <h1 id="intro-title">Niche Knowledge Check</h1>
  <p class="muted" id="intro-blurb"></p>
  <p class="muted" id="intro-note"></p>

  <label for="handle">Discord handle</label>
  <input type="text" id="handle" placeholder="yourname"
         autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="40">
  <p class="err" id="handle-err" role="alert"></p>

  <div class="row">
    <button class="btn" id="start">Start the quiz</button>
  </div>
</main>

<!-- ============================================================
     SCREEN 2: questions
     ============================================================ -->
<main class="card hidden" id="screen-quiz">
  <div class="meta">
    <span id="q-counter"></span>
    <span id="q-handle"></span>
  </div>
  <div class="bar"><i id="q-bar"></i></div>

  <h2 class="qtext" id="q-text"></h2>
  <div class="options" id="q-options" role="radiogroup" aria-labelledby="q-text"></div>
  <p class="err" id="q-err" role="alert"></p>

  <div class="row">
    <button class="btn ghost" id="back">Back</button>
    <span class="spacer"></span>
    <button class="btn" id="next">Next</button>
  </div>
</main>

<!-- ============================================================
     SCREEN 3: results
     ============================================================ -->
<main class="card hidden" id="screen-results">
  <span class="pill" id="r-attempt"></span>
  <p class="score" id="r-score"></p>
  <p class="band" id="r-band"></p>
  <p class="muted" id="r-feedback"></p>

  <p class="muted" id="r-retry-note">Answers aren't shown. That's deliberate.</p>

  <div id="r-history-wrap" class="hidden">
    <hr>
    <p class="muted" style="font-weight:600; color:var(--ink); margin-bottom:8px">Your attempts on this device</p>
    <ul class="hist" id="r-history"></ul>
  </div>

  <div class="row">
    <button class="btn" id="retake">Take it again</button>
  </div>
  <p class="status" id="r-status"></p>
</main>

</div>

<script>
/* ==================================================================
   CONFIG: everything you edit lives in this block.
   ================================================================== */

const CONFIG = {
  /* The deployment carrying the updated Code.gs, the one with the Quiz
     column. The theme page quiz still posts to an older deployment of
     that same script, which runs the previous version of the code until
     it is bumped. See SETUP.md. */
  endpoint: "https://script.google.com/macros/s/AKfycbzVKuO377whES3fwbvGsxxHS1X_ctW-bWx64ueuQYt-ptq_rimH1NrHh6ynTLxJxnS7/exec",

  /* Goes in the Quiz column of the shared sheet. Keep it short and keep
     it stable: changing it splits this quiz's rows in two. */
  quizId: "niche",

  title:  "Niche Knowledge Check",

  /* The intro is one line: the question count and rough time are added
     automatically, then this. Set blurb to add a second line above it,
     or to "" to leave it out, which is what it does now. */
  note:   "Your score at the end, but not the answers.",
  blurb:  "",

  /* Save attempts to this browser so returning users see their history.
     Device-local only. The Google Sheet is the real record. */
  localHistory: true
};

/* ------------------------------------------------------------------
   QUESTIONS: `answer` is the 0-based index of the correct option,
   so 0 = first option, 3 = fourth.
   ------------------------------------------------------------------ */

const QUESTIONS = [
  { q: "What is a niche?",
    options: [
      "A specific topic your content is about",
      "The platform you post on",
      "The type of product you sell",
      "The age of your audience"
    ], answer: 0 },

  { q: "Which of these is a niche?",
    options: [
      "Posting three reels a day",
      "Travel",
      "Instagram",
      "Selling digital products"
    ], answer: 1 },

  { q: "When should you choose your niche?",
    options: [
      "After your first thousand followers, once you know what works",
      "Before you create any content",
      "Once you've found a product to sell",
      "After testing different topics on the same page"
    ], answer: 1 },

  { q: "Someone has been posting for two months with almost nothing to show for it. What should be the reason they keep going?",
    options: [
      "Whether they've built a posting habit",
      "Whether the niche makes enough money",
      "Whether they're genuinely interested in the topic",
      "Whether someone is keeping them accountable"
    ], answer: 2 },

  { q: "A creator is choosing between a niche they love but know little about, and one they find boring but already understand. Which should they choose?",
    options: [
      "The one they love. Interest will keep them going, and they can learn as they go",
      "The boring one. They already know enough to make good content",
      "Neither. They should choose a niche with less competition",
      "Whichever one has more successful creators"
    ], answer: 0 },

  { q: "Is choosing a niche you like enough to grow a page?",
    options: [
      "Yes. Enjoying the niche is what drives growth",
      "No. You also need to keep learning and focus on what works",
      "Yes, as long as the niche is evergreen",
      "No. You need paid ads to grow"
    ], answer: 1 },

  { q: "When thinking about whether a niche can make money, what should you remember?",
    options: [
      "Followers and engagement are different things",
      "Getting views and making money are different things",
      "Organic and paid reach are different things",
      "Brand deals and affiliate income are different things"
    ], answer: 1 },

  { q: "If creating content is half the job, what is the other half?",
    options: [
      "Growing your followers as quickly as possible",
      "Replying to comments and building a community",
      "Editing and scheduling posts",
      "Finding new ways to make money from the page"
    ], answer: 3 },

  { q: "Instead of trying to find new things to sell, what should you do?",
    options: [
      "Look at what successful pages in your niche are already selling",
      "Ask your audience what they want to buy",
      "Test lots of products at the same time",
      "Create something no one in your niche has made before"
    ], answer: 0 },

  { q: "Once you find a product that works, what should you do?",
    options: [
      "Introduce it slowly over several months",
      "Go all in on it",
      "Test it against two or three other products",
      "Only offer it to your most engaged followers"
    ], answer: 1 },

  { q: "A creator loves their niche and posts consistently for months, but the page barely grows. What's the most likely reason?",
    options: [
      "They haven't posted enough",
      "Their content isn't good enough",
      "The niche doesn't have enough demand. It's a dead niche",
      "They started selling too early"
    ], answer: 2 },

  { q: "Your niche needs to be one of two things. Which two?",
    options: [
      "Broad or very specific",
      "Local or international",
      "Trending or seasonal",
      "A growing industry or an evergreen niche"
    ], answer: 3 },

  { q: "What makes a niche evergreen?",
    options: [
      "It's new and growing quickly",
      "People will always want it, even after trends change",
      "It has very few creators",
      "It's easy to make money from"
    ], answer: 1 },

  { q: "What does choosing a niche with real demand do for your page?",
    options: [
      "Sponsors will approach you before you have an audience",
      "The algorithm is more likely to push your content, helping the page grow faster",
      "You can charge more for shoutouts right away",
      "You don't need to post as often"
    ], answer: 1 },

  { q: "What's the combination you're looking for?",
    options: [
      "A niche with low competition and high payouts",
      "A niche that's quick and cheap to create content for",
      "A niche you're interested in that also has an audience that wants it",
      "A niche you already know well enough to teach"
    ], answer: 2 }
];

/* ------------------------------------------------------------------
   BANDS: `minPct` is the lowest percentage that earns this band, so
   these stay correct if you add or remove questions. Checked top to
   bottom, so keep them in descending order.
   ------------------------------------------------------------------ */

const BANDS = [
  { minPct: 100, label: "Full marks",
    text: "You already understand how picking a niche works: interest, demand, and the gap between getting views and making money. Use the content to sharpen the details and to pressure-test what you think you know." },

  { minPct: 80, label: "Strong footing",
    text: "You have a clear grasp of what makes a niche work and only missed a few. Go through the content, then come back and run this again. Full marks is well within reach." },

  { minPct: 60, label: "Solid start",
    text: "The basics are there, but a decent chunk of this is new ground. Work through the content properly, then take the quiz again and see how far you move." },

  { minPct: 40, label: "Plenty to gain",
    text: "You know some of it and there is real upside here. Go through the content in order, because the niche you pick comes before everything else you do with the page. Then take another run at this." },

  { minPct: 0, label: "Fresh start",
    text: "Most of this is new to you, which is exactly what this check is for. Start at the beginning and take your time, then come back to the quiz once you have been through it." }
];

/* ==================================================================
   Below this line is the machinery. You shouldn't need to touch it.
   ================================================================== */

const TOTAL = QUESTIONS.length;
const LS_HISTORY = "dq.niche.history.v1";
const LS_PENDING = "dq.niche.pending.v1";
const KEYS = ["A", "B", "C", "D", "E", "F"];

const $ = id => document.getElementById(id);

const state = { handle: "", index: 0, answers: new Array(TOTAL).fill(null) };

/* ---------- localStorage, defensively ---------- */

function lsRead(key) {
  try {
    const raw = localStorage.getItem(key);
    const val = raw ? JSON.parse(raw) : [];
    return Array.isArray(val) ? val : [];
  } catch (_) { return []; }
}

function lsWrite(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch (_) { return false; }
}

/* ---------- submission ----------
   Apps Script web apps don't return usable CORS headers on POST, so the
   request goes out as a no-cors "simple request" (text/plain body, no
   preflight). The response is opaque: a resolved fetch means the browser
   handed the request off, not that the sheet wrote a row. Anything that
   fails outright gets queued and retried on the next page load. */

function postAttempt(payload) {
  if (!CONFIG.endpoint) return Promise.reject(new Error("no endpoint configured"));
  return fetch(CONFIG.endpoint, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  });
}

function queuePending(payload) {
  const pending = lsRead(LS_PENDING);
  pending.push(payload);
  lsWrite(LS_PENDING, pending.slice(-25));
}

function flushPending() {
  const pending = lsRead(LS_PENDING);
  if (!pending.length || !CONFIG.endpoint) return;
  lsWrite(LS_PENDING, []);
  pending.forEach(p => postAttempt(p).catch(() => queuePending(p)));
}

/* ---------- screens ---------- */

function show(which) {
  ["intro", "quiz", "results"].forEach(name => {
    $("screen-" + name).classList.toggle("hidden", name !== which);
  });
  window.scrollTo(0, 0);
}

/* ---------- intro ---------- */

/* A blank intro line is removed rather than left as an empty gap, so the
   intro can be trimmed from CONFIG alone. */
function introLine(id, text) {
  const el = $(id);
  el.textContent = text || "";
  el.classList.toggle("hidden", !text);
}

function initIntro() {
  document.title = CONFIG.title;
  $("intro-title").textContent = CONFIG.title;
  introLine("intro-blurb", CONFIG.blurb);
  introLine("intro-note",
    TOTAL + " questions, about " + Math.max(2, Math.round(TOTAL * 0.4)) +
    " minutes. " + CONFIG.note);

  $("handle").addEventListener("keydown", e => { if (e.key === "Enter") startQuiz(); });
  $("handle").addEventListener("input", () => { $("handle-err").textContent = ""; });
  $("start").addEventListener("click", startQuiz);
}

function startQuiz() {
  const handle = $("handle").value.trim().replace(/^@/, "");
  if (!handle) {
    $("handle-err").textContent = "Enter your Discord handle so your score can be matched to you.";
    $("handle").focus();
    return;
  }
  if (handle.length < 2) {
    $("handle-err").textContent = "That looks too short. Use the handle people see in the server.";
    $("handle").focus();
    return;
  }
  $("handle-err").textContent = "";
  state.handle = handle;
  state.index = 0;
  state.answers = new Array(TOTAL).fill(null);
  show("quiz");
  renderQuestion();
}

/* ---------- quiz ---------- */

function renderQuestion() {
  const i = state.index;
  const item = QUESTIONS[i];

  $("q-counter").textContent = "Question " + (i + 1) + " of " + TOTAL;
  $("q-handle").textContent = state.handle;
  $("q-bar").style.width = ((i / TOTAL) * 100) + "%";
  $("q-text").textContent = item.q;
  $("q-err").textContent = "";

  const box = $("q-options");
  box.textContent = "";
  item.options.forEach((text, idx) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "option";
    btn.setAttribute("role", "radio");
    btn.setAttribute("aria-checked", String(state.answers[i] === idx));

    const key = document.createElement("span");
    key.className = "key";
    key.textContent = KEYS[idx];
    const label = document.createElement("span");
    label.textContent = text;

    btn.append(key, label);
    btn.addEventListener("click", () => select(idx));
    box.appendChild(btn);
  });

  $("back").classList.toggle("hidden", i === 0);
  $("next").textContent = (i === TOTAL - 1) ? "See my score" : "Next";
}

function select(idx) {
  state.answers[state.index] = idx;
  $("q-err").textContent = "";
  Array.from($("q-options").children).forEach((btn, n) => {
    btn.setAttribute("aria-checked", String(n === idx));
  });
}

function goNext() {
  if (state.answers[state.index] === null) {
    $("q-err").textContent = "Pick an option to carry on.";
    return;
  }
  if (state.index === TOTAL - 1) { finish(); return; }
  state.index++;
  renderQuestion();
}

function goBack() {
  if (state.index === 0) return;
  state.index--;
  renderQuestion();
}

document.addEventListener("keydown", e => {
  if ($("screen-quiz").classList.contains("hidden")) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;

  const n = "1234".indexOf(e.key);
  if (n > -1 && n < QUESTIONS[state.index].options.length) { e.preventDefault(); select(n); return; }

  const letter = KEYS.indexOf(e.key.toUpperCase());
  if (letter > -1 && letter < QUESTIONS[state.index].options.length) { e.preventDefault(); select(letter); return; }

  if (e.key === "Enter") { e.preventDefault(); goNext(); }
});

/* ---------- results ---------- */

function scoreOf(answers) {
  return answers.reduce((sum, a, i) => sum + (a === QUESTIONS[i].answer ? 1 : 0), 0);
}

function bandFor(score) {
  const pct = (score / TOTAL) * 100;
  return BANDS.find(b => pct >= b.minPct) || BANDS[BANDS.length - 1];
}

function finish() {
  const score = scoreOf(state.answers);
  const payload = {
    handle: state.handle,
    score: score,
    total: TOTAL,
    timestamp: new Date().toISOString(),
    quiz: CONFIG.quizId
  };

  /* Local history first, because it must not depend on the network. */
  let mine = [];
  if (CONFIG.localHistory) {
    const all = lsRead(LS_HISTORY);
    all.push(payload);
    lsWrite(LS_HISTORY, all.slice(-50));
    mine = all.filter(a => (a.handle || "").toLowerCase() === state.handle.toLowerCase());
  }

  renderResults(score, mine);
  show("results");

  /* Then the sheet, in the background. */
  if (CONFIG.endpoint) {
    $("r-status").textContent = "Sending your result…";
    postAttempt(payload)
      .then(() => { $("r-status").textContent = "Result sent. You can close this page."; })
      .catch(() => {
        queuePending(payload);
        $("r-status").textContent = "Couldn't reach the server. Your result is saved on this device and will be sent next time you open this page.";
      });
  } else {
    $("r-status").textContent = "No storage endpoint is configured, so this result was saved on this device only.";
  }
}

function renderResults(score, mine) {
  const band = bandFor(score);

  $("r-score").innerHTML = "";
  $("r-score").append(String(score));
  const small = document.createElement("small");
  small.textContent = " / " + TOTAL;
  $("r-score").appendChild(small);

  $("r-band").textContent = band.label;
  $("r-feedback").textContent = band.text;

  /* Attempt number + comparison with the previous try on this device. */
  const attemptPill = $("r-attempt");
  if (mine.length > 1) {
    const prev = mine[mine.length - 2];
    const delta = score - prev.score;
    const move = delta > 0 ? "up from " + prev.score
               : delta < 0 ? "down from " + prev.score
               : "same as last time";
    attemptPill.textContent = "Attempt " + mine.length + ", " + move;
    attemptPill.classList.remove("hidden");
  } else {
    attemptPill.textContent = state.handle;
  }

  /* History list. */
  if (CONFIG.localHistory && mine.length > 1) {
    const ul = $("r-history");
    ul.textContent = "";
    mine.slice().reverse().forEach((a, n) => {
      const li = document.createElement("li");
      const when = new Date(a.timestamp);
      const stamp = isNaN(when) ? "" : when.toLocaleDateString(undefined, { day: "numeric", month: "short" }) +
                                       ", " + when.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
      li.textContent = "Attempt " + (mine.length - n) + ": " + a.score + "/" + a.total + (stamp ? " · " + stamp : "");
      ul.appendChild(li);
    });
    $("r-history-wrap").classList.remove("hidden");
  } else {
    $("r-history-wrap").classList.add("hidden");
  }

}

function retake() {
  $("handle").value = state.handle;
  show("intro");
}

/* ---------- wire up ---------- */

$("next").addEventListener("click", goNext);
$("back").addEventListener("click", goBack);
$("retake").addEventListener("click", retake);

initIntro();
flushPending();
</script>
</body>
</html>
